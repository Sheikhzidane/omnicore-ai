name: Supabase backup (manual)

# SECURITY (Phase 1): this workflow used to run nightly and COMMIT the dump
# (including subscriber email addresses) into the git repository and push it.
# Database contents must never be committed. It now runs only on demand and
# stores the dump as a short-lived, access-controlled workflow artifact.
# For production, prefer Supabase's managed backups / PITR.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backup
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-supabase.mjs

      - name: Upload snapshot (private artifact, 7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/*.json
          retention-days: 7
          if-no-files-found: error
